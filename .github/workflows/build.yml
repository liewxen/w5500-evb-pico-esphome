name: ESPHome Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-esphome-${{ hashFiles('w5500-hello.yml') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install --upgrade esphome

      - name: Generate PlatformIO project
        run: esphome compile --only-generate w5500-hello.yml

      - name: Build firmware
        run: |
          pip install --upgrade platformio
          pio run -d ".esphome/build/w5500-hello"

      - name: Archive firmware
        uses: actions/upload-artifact@v4
        with:
          name: w5500-esphome.uf2
          path: .esphome/build/w5500-hello/.pio/build/w5500-hello/firmware.uf2
