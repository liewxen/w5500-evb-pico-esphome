---
esphome:
  name: w5500-hello
  # Uncomment to upload via debug probe:
  # platformio_options:
  #   upload_protocol: cmsis-dap
  #   debug_tool: cmsis-dap

rp2040:
  board: wiznet_5500_evb_pico  # W55RP20-EVB-Pico / W5500-EVB-Pico
  framework:
    # GCC 14, pico-sdk 2.0
    platform_version: https://github.com/maxgerhardt/platform-raspberrypi.git
    # arduino-pico 5.5.0
    version: 5.5.0

external_components:
  - source: components

w5500_ethernet:
  # DHCP by default.  Uncomment for static IP:
  # manual_ip:
  #   static_ip: 192.168.0.123
  #   gateway: 192.168.0.1
  #   subnet: 255.255.255.0
  #   dns1: 8.8.8.8

# ---- Home Assistant native API ----
api:

# ---- OTA (network upload) ----
ota:
  - platform: esphome

# ---- Logging ----
logger:
  level: DEBUG
  hardware_uart: USB_CDC    # or UART0 for GP0

# ---- Web dashboard ----
web_server:
  port: 80

# ---- Onboard LED ----
switch:
  - platform: gpio
    pin: 25
    name: "Onboard LED"
    id: onboard_led

